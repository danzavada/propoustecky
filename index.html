<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propouštěčky</title>
  <meta name="description" content="Převod mikrobiologických nálezů z NIS VFN do stručného textu.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="logo" href="./">
        <span class="logo-name">Propouštěčky</span>
        <span class="logo-sub">Zkracovač zpráv z mikrobiologie VFN</span>
      </a>
      <span class="privacy">Text se zpracovává jen v tomto prohlížeči a nikam se neodesílá.</span>
    </div>
  </header>

  <main class="container">
    <div class="panes">
      <section class="pane">
        <div class="pane-head">
          <label for="input" class="pane-title">Nálezy z NIS</label>
          <div class="actions">
            <button type="button" id="clear" class="btn-ghost">Vymazat</button>
          </div>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off"
          placeholder="Sem vlož text nálezů zkopírovaný ze systému…"></textarea>
      </section>

      <section class="pane">
        <div class="pane-head">
          <span class="pane-title" id="output-label">Přeformátováno <span id="count" class="muted"></span></span>
          <div class="actions">
            <span class="select">
              <select id="font" aria-label="Písmo výstupu">
                <option value="arial">Arial CE</option>
                <option value="calibri">Calibri</option>
                <option value="times">Times New Roman</option>
              </select>
            </span>
            <span class="select">
              <select id="size" aria-label="Velikost písma výstupu">
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="14">14</option>
              </select>
            </span>
            <button type="button" id="copy" class="btn-primary" disabled>Kopírovat</button>
          </div>
        </div>
        <div id="warnings" class="warnings" hidden></div>
        <div id="output" class="output" role="region" aria-labelledby="output-label"
          data-placeholder="Výsledek se objeví tady."></div>
      </section>
    </div>
  </main>


  <script src="assets/formatter.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
